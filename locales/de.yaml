api_key_required_title: "🔑 **OpenAI-API-Schlüssel erforderlich**"
api_key_required_body: |
  Bitte füge deinen OpenAI-API-Schlüssel in den Streamlit-Cloud-Einstellungen hinzu:

  1. Gehe in den App-Einstellungen auf Streamlit Cloud
  2. Füge dieses Secret hinzu:
     ```
     OPENAI_API_KEY = "your-openai-api-key-here"
     ```
  3. Hole dir einen API-Schlüssel auf der [OpenAI Platform](https://platform.openai.com/api-keys)
  4. Deploy die App neu

  Ohne API-Schlüssel funktioniert die App nicht.
db_config_title: "🔧 **Datenbankkonfiguration erforderlich**"
db_config_body: |
  Für den vollen Funktionsumfang richte bitte eine PostgreSQL-Datenbank ein:

  1. Richte eine Cloud-PostgreSQL-Datenbank ein
     Kostenlose Optionen:
     - [Neon.tech](https://neon.tech) - 500MB frei, serverloses PostgreSQL
     - [Supabase](https://supabase.com) - 500MB frei, inkl. Realtime
     - [ElephantSQL](https://elephantsql.com) - 20MB frei ("Tiny Turtle")
     - [Railway](https://railway.app) - PostgreSQL mit Free-Tarif
  2. Trage die Datenbank-Secrets in den Streamlit-Cloud-Einstellungen ein:
     ```
     [postgres]
     host = "your-postgres-host"
     port = "5432"
     database = "your-database-name"
     user = "your-username"
     password = "your-password"
     ```
  3. Starte die App neu

  Die Chat-Funktion läuft auch ohne DB, aber Logging und Admin-Funktionen sind deaktiviert.

api_key_required_title: "🔑 **Wymagany klucz API OpenAI**"
api_key_required_body: |
  Dodaj swój klucz API OpenAI w ustawieniach Streamlit Cloud:

  1. Wejdź w ustawienia aplikacji w Streamlit Cloud
  2. Dodaj ten secret:
     ```
     OPENAI_API_KEY = "your-openai-api-key-here"
     ```
  3. Pobierz klucz API z [OpenAI Platform](https://platform.openai.com/api-keys)
  4. Wdróż aplikację ponownie

  Aplikacja nie zadziała bez klucza API.
db_config_title: "🔧 **Wymagana konfiguracja bazy danych**"
db_config_body: |
  Aby uzyskać pełną funkcjonalność, skonfiguruj bazę danych PostgreSQL:

  1. Utwórz bazę PostgreSQL w chmurze
     Darmowe opcje:
     - [Neon.tech](https://neon.tech) - 500MB gratis, serverless PostgreSQL
     - [Supabase](https://supabase.com) - 500MB gratis, funkcje realtime
     - [ElephantSQL](https://elephantsql.com) - 20MB gratis („Tiny Turtle”)
     - [Railway](https://railway.app) - PostgreSQL z darmowym planem
  2. Dodaj dane dostępowe w ustawieniach Streamlit Cloud:
     ```
     [postgres]
     host = "your-postgres-host"
     port = "5432"
     database = "your-database-name"
     user = "your-username"
     password = "your-password"
     ```
  3. Ponownie uruchom aplikację

  Czat zadziała bez bazy, ale logowanie i funkcje administracyjne będą wyłączone.
